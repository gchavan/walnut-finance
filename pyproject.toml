[project]
name = "walnut"
version = "0.1.0"
description = "Personal household finance dashboard. Live backend: SimpleFIN Bridge."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
]

[project.scripts]
walnut = "walnut.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["walnut"]
